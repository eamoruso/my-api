openapi: 3.0.3
info:
  title: Zombie APIs Research - Comprehensive API
  description: A comprehensive REST API for Zombie APIs research with 100+ endpoints following OpenAPI specifications
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: https://my-api-ir2t.onrender.com/api/v1
    description: Production server

paths:
  # System endpoints (10)
  /system/health:
    get:
      tags: [System]
      summary: Health check
      responses: { '200': { description: OK } }
  /system/ready:
    get:
      tags: [System]
      summary: Readiness check
      responses: { '200': { description: OK } }
  /system/version:
    get:
      tags: [System]
      summary: Get version
      responses: { '200': { description: OK } }
  /system/config:
    get:
      tags: [System]
      summary: Get configuration
      responses: { '200': { description: OK } }
  /system/metrics:
    get:
      tags: [System]
      summary: Get metrics
      responses: { '200': { description: OK } }
  /system/metrics/increment:
    post:
      tags: [System]
      summary: Increment counter
      responses: { '200': { description: OK } }
  /system/status:
    get:
      tags: [System]
      summary: Get status
      responses: { '200': { description: OK } }
  /system/env:
    get:
      tags: [System]
      summary: Get environment variables
      responses: { '200': { description: OK } }
  /system/routes:
    get:
      tags: [System]
      summary: List all routes
      responses: { '200': { description: OK } }
  /system/cache:
    delete:
      tags: [System]
      summary: Clear cache
      responses: { '200': { description: OK } }

  # User endpoints (19)
  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - name: page, in: query, schema: { type: integer }
        - name: limit, in: query, schema: { type: integer }
        - name: search, in: query, schema: { type: string }
        - name: role, in: query, schema: { type: string }
      responses: { '200': { description: OK } }
    post:
      tags: [Users]
      summary: Create user
      responses: { '201': { description: Created } }
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    put:
      tags: [Users]
      summary: Update user
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    patch:
      tags: [Users]
      summary: Patch user
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    delete:
      tags: [Users]
      summary: Delete user
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }

  /users/search/username/{query}:
    get:
      tags: [Users]
      summary: Search by username
      parameters: [{ name: query, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /users/search/email/{domain}:
    get:
      tags: [Users]
      summary: Search by email domain
      parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /users/search/advanced:
    post:
      tags: [Users]
      summary: Advanced search
      responses: { '200': { description: OK } }

  /users/count:
    get:
      tags: [Users]
      summary: Get total user count
      responses: { '200': { description: OK } }
  /users/count/by-role:
    get:
      tags: [Users]
      summary: Count users by role
      responses: { '200': { description: OK } }
  /users/exists/email/{email}:
    get:
      tags: [Users]
      summary: Check if email exists
      parameters: [{ name: email, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }

  /users/batch/create:
    post:
      tags: [Users]
      summary: Batch create users
      responses: { '201': { description: Created } }
  /users/batch/update:
    post:
      tags: [Users]
      summary: Batch update users
      responses: { '200': { description: OK } }
  /users/batch/delete:
    delete:
      tags: [Users]
      summary: Batch delete users
      responses: { '200': { description: OK } }

  /users/roles:
    get:
      tags: [Users]
      summary: List all roles
      responses: { '200': { description: OK } }
  /users/{id}/assign-role:
    post:
      tags: [Users]
      summary: Assign role to user
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /users/roles/{role}:
    get:
      tags: [Users]
      summary: Get users by role
      parameters: [{ name: role, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /users/export:
    post:
      tags: [Users]
      summary: Export users as JSON
      responses: { '200': { description: OK } }

  # Auth endpoints (19)
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      responses: { '200': { description: OK } }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      responses: { '201': { description: Created } }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      responses: { '200': { description: OK } }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      responses: { '200': { description: OK } }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      responses: { '200': { description: OK } }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with token
      responses: { '200': { description: OK } }
  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      responses: { '200': { description: OK } }
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify email address
      responses: { '200': { description: OK } }
  /auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend verification email
      responses: { '200': { description: OK } }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      responses: { '200': { description: OK } }

  /auth/sessions:
    post:
      tags: [Authentication]
      summary: List sessions (create)
      responses: { '200': { description: OK } }
    get:
      tags: [Authentication]
      summary: Get active sessions
      responses: { '200': { description: OK } }
  /auth/sessions/current:
    delete:
      tags: [Authentication]
      summary: Terminate current session
      responses: { '200': { description: OK } }
  /auth/sessions/{id}:
    delete:
      tags: [Authentication]
      summary: Terminate specific session
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK }, '404': { description: Not found } }

  /auth/2fa/enable:
    post:
      tags: [Authentication]
      summary: Enable 2FA
      responses: { '200': { description: OK } }
  /auth/2fa/disable:
    post:
      tags: [Authentication]
      summary: Disable 2FA
      responses: { '200': { description: OK } }
  /auth/2fa/verify:
    post:
      tags: [Authentication]
      summary: Verify 2FA code
      responses: { '200': { description: OK } }
  /auth/oauth/google:
    post:
      tags: [Authentication]
      summary: Google OAuth login
      responses: { '200': { description: OK } }
  /auth/oauth/github:
    post:
      tags: [Authentication]
      summary: GitHub OAuth login
      responses: { '200': { description: OK } }
